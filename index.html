<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aumeverse — Coming Soon</title>
<style>
  :root {
    --page-bg-1: #e9e3ec;
    --page-bg-2: #d9d0e0;
    --card-bg: #121016;
    --card-bg-2: #0a090d;
    --glow-core: #ff8a5c;
    --glow-mid: #e0567a;
    --glow-edge: #7b3fa0;
    --text-primary: #f3f1f5;
    --text-muted: #8b8794;
    --text-faint: #5c5866;
    --accent: #e98a6b;
    --input-bg: #1c1a22;
    --input-border: #322f3a;
    --btn-bg: #2a2732;
    --btn-border: #46414f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 30%, var(--page-bg-1), var(--page-bg-2));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .stage {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 10;
    perspective: 1400px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, var(--card-bg) 0%, var(--card-bg-2) 100%);
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 40px 80px -20px rgba(30, 20, 40, 0.45),
      0 15px 35px -15px rgba(30, 20, 40, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Eclipse ---------- */
  .eclipse-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .eclipse-glow {
    position: absolute;
    top: 8%;
    width: min(52%, 420px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 45%,
        rgba(255, 178, 130, 0.55) 0%,
        rgba(230, 110, 110, 0.4) 30%,
        rgba(150, 70, 130, 0.22) 52%,
        rgba(80, 50, 100, 0.08) 70%,
        rgba(18, 16, 22, 0) 78%);
    filter: blur(2px);
    animation: breathe 7s ease-in-out infinite;
  }

  .eclipse-rim {
    position: absolute;
    top: 8%;
    width: min(38%, 300px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #ffb98f 0%, #f0805e 22%, #d95a72 42%, transparent 72%);
    filter: blur(0.5px);
    opacity: 0.9;
  }

  .eclipse-body {
    position: absolute;
    top: calc(8% + 6px);
    width: min(36.5%, 288px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #23202b 0%, #17151d 55%, #0d0c11 100%);
    box-shadow: 0 0 60px 10px rgba(233, 138, 107, 0.15);
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.035); }
  }

  /* ---------- Content ---------- */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 28px 32px 0;
  }

  .brand-mark {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--glow-core), var(--glow-edge));
    flex-shrink: 0;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .brand-name {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: var(--text-primary);
    text-transform: uppercase;
    line-height: 1;
  }

  .brand-tagline {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    line-height: 1;
  }

  .center-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    margin-top: 6%;
  }

  .headline {
    font-size: clamp(20px, 4vw, 34px);
    font-weight: 300;
    letter-spacing: 0.5em;
    color: var(--text-primary);
    margin: 0;
    padding-left: 0.5em; /* balance the trailing letter-spacing visually */
  }

  .footer-block {
    padding: 0 24px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0;
  }

  .notify-form {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 999px;
    padding: 5px 5px 5px 18px;
    width: 100%;
    max-width: 340px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .notify-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(233, 138, 107, 0.18);
  }

  .notify-form input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    min-width: 0;
  }

  .notify-form input::placeholder {
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  .notify-btn {
    flex-shrink: 0;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
  }

  .notify-btn:hover {
    background: #35313f;
    border-color: var(--accent);
  }

  .notify-btn:active {
    transform: scale(0.97);
  }

  .notify-btn:focus-visible,
  .notify-form input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .status-msg {
    font-size: 11px;
    color: var(--text-muted);
    min-height: 14px;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .status-msg.show {
    color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .eclipse-glow { animation: none; }
  }

  @media (max-width: 520px) {
    .stage { aspect-ratio: 3 / 4; }
    .headline { letter-spacing: 0.32em; }
    .brand { padding: 22px 20px 0; }
    .footer-block { padding: 0 20px 32px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="card">

      <div class="eclipse-wrap" aria-hidden="true">
        <div class="eclipse-glow"></div>
        <div class="eclipse-rim"></div>
        <div class="eclipse-body"></div>
      </div>

      <div class="content">
        <div class="brand">
          <span class="brand-mark"></span>
          <div class="brand-text">
            <span class="brand-name">Aumeverse</span>
            <span class="brand-tagline">Building intelligent systems</span>
          </div>
        </div>

        <div class="center-block">
          <h1 class="headline">COMING&nbsp;SOON</h1>
        </div>

        <div class="footer-block">
          <p class="eyebrow">Get notified when it's ready</p>
          <form class="notify-form" id="notifyForm">
            <input
              type="email"
              id="emailInput"
              placeholder="Enter your email"
              autocomplete="email"
              required
              aria-label="Email address"
            >
            <button type="submit" class="notify-btn">Notify me</button>
          </form>
          <p class="status-msg" id="statusMsg"></p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById('notifyForm');
    const status = document.getElementById('statusMsg');
    const emailInput = document.getElementById('emailInput');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      // Placeholder behavior — wire this up to your actual signup endpoint.
      status.textContent = "You're on the list. We'll be in touch.";
      status.classList.add('show');
      emailInput.value = '';
    });
  </script>

</body>
</html>
